name: Fetch FANZA Works

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: pip install requests

      - name: Fetch FANZA works
        env:
          FANZA_API_ID: ${{ secrets.FANZA_API_ID }}
          FANZA_AFFILIATE_ID: ${{ secrets.FANZA_AFFILIATE_ID }}
        run: python scripts/fetch_fanza.py

      - name: Fetch reviews
        run: python scripts/fetch_reviews.py

      - name: Fetch extras
        run: python scripts/fetch_extra.py

      - name: Filter works
        run: python scripts/filter_works.py

      - name: Score works
        run: python scripts/score_works.py

      - name: Select theme
        run: python scripts/select_theme.py

      - name: Commit data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/works.json
          git add data/reviews.json
          git add data/extra.json
          git add data/selected_candidates.json
          git add data/scored_works.json
          git add data/current_theme.json
          git commit -m "Update FANZA data" || echo "No changes"
          git push
