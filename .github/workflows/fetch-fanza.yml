name: Fetch FANZA Works

on:
  workflow_dispatch:

  schedule:
    # JST 08:00
    - cron: "0 23 * * *"

    # JST 20:00
    - cron: "0 11 * * *"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: |
          pip install requests google-genai

      - name: Fetch FANZA works
        env:
          FANZA_API_ID: ${{ secrets.FANZA_API_ID }}
          FANZA_AFFILIATE_ID: ${{ secrets.FANZA_AFFILIATE_ID }}
        run: python scripts/fetch_fanza.py

      - name: Filter works
        run: python scripts/filter_works.py

      - name: Analyze genres
        run: python scripts/analyze_genres.py

      - name: Generate themes
        run: python scripts/generate_themes.py

      - name: Score works
        run: python scripts/score_works.py

      - name: Select theme
        run: python scripts/select_theme.py

      - name: Select works
        run: python scripts/select_works.py

      - name: Fetch reviews
        run: python scripts/fetch_reviews.py

      - name: Fetch extras
        run: python scripts/fetch_extra.py

      - name: Generate article
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          for i in 1 2 3; do
            echo "Generate attempt $i"

            if python scripts/generate_article.py; then
              echo "Generate success"
              break
            fi

            if [ "$i" -eq 3 ]; then
              echo "Generate failed after 3 attempts"
              exit 1
            fi

            sleep 60
          done

      - name: Save history
        run: python scripts/save_history.py

      - name: Post to WordPress
        env:
          WP_SITE_URL: ${{ secrets.WP_SITE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: python scripts/post_to_wordpress.py

      - name: Commit data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add data/works.json
          git add data/reviews.json
          git add data/extra.json
          git add data/selected_candidates.json
          git add data/scored_works.json
          git add data/current_theme.json
          git add data/genre_counts.json
          git add data/themes.json
          git add data/selected_article_works.json
          git add data/generated_article.md
          git add data/used_works.json
          git add data/used_themes.json
          git add data/article_history.json

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Update FANZA data"
          git push
